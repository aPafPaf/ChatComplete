name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dll:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build native/build --config Release --target nativesuggest
      - name: Upload the DLL
        uses: actions/upload-artifact@v4
        with:
          name: NativeSuggest
          path: native/build/Release/NativeSuggest.dll

  index:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check mods.json
        shell: pwsh
        run: ./tools/build-index.ps1 -Check
